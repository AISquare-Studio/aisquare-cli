name: CI

on:
  pull_request:
    branches: [main, "rc/**"]
  push:
    branches: [main, "rc/**"]
  # Nightly, on the default branch: between releases nothing pushes to main, and
  # a runner image or an unpinned dependency can still move under it. 06:40 UTC,
  # clear of install.yml's 05:20.
  schedule:
    - cron: "40 6 * * *"
  # By hand, on any branch (`gh workflow run ci.yml --ref <branch>`): a fresh
  # baseline without a push.
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR. Grouped by event too: by ref
# alone, the nightly shared main's group with pushes to main, so a push
# cancelled the nightly or the nightly cancelled a push's run. A run by hand
# has a group of its own for the same reason.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# THE LAYOUT: THE SUITE IN SHARDS (2026-10-25). The suite is ~13k tests and about
# 65 minutes of one core, with a long tail (6,122 tests of 0.1 s or more hold 96.5%
# of the time), so no single test or fixture is the problem. Measured on main
# 82e293b9 (run 40218362245): a 4-vCPU standard runner with `pytest -n auto` took
# 21-24 minutes per Linux leg and 53 on Windows (61 median, 138 at worst), and the
# two ambient legs ran the suite SERIALLY for 63-64, so the full matrix took 64
# minutes and a sub-PR's one leg 22 (run 40220936072). The same suite takes 6
# minutes on 14 cores: the CPU is the bottleneck, and standard runners are free on
# this public repo (owner decision: no larger runners). So each leg's suite is split
# across runners:
#
#   lint     ruff check, ruff format --check, mypy and `uv lock --check`, once. They
#            ran on every leg, and mypy checks python_version 3.11 whatever runs it.
#   test     each leg's suite in shards: pytest-split (`--splits N --group k`) splits
#            it by the per-test times in .test_durations (CI's own, from the
#            shards' notes), and each shard runs on every core (`-n auto`). 4 shards
#            per Linux leg, 10 on Windows, where the suite takes about three times as
#            long (61 minutes of test time on 4 cores, against 19 on Linux, run
#            40226083784). The two ambient legs are folded in
#            (owner decision): py3.11 runs in the proxy-down ambient and py3.13 in
#            proxy-up, sharded and parallel like the rest, so the full matrix runs
#            the suite 5 times rather than 7.
#   shards   reads what every shard collected and ran, and fails unless each leg's
#            shards ran its collection exactly once (tests/shards.py).
#   package  the sdist and wheel, built and smoke-tested.
#   ci-ok    passes only when every job above did: the one check for branch
#            protection to require, whatever the number of legs or shards.
#
# Measured after, on 7776eaea: a sub-PR's slowest job ended 8.2 minutes after its
# run started, against 22 (run 40230232483: the 4 shards 4.6-8.1); the full
# matrix's at 14.3, against 64 (run 40230136547: Linux shards 4.5-7.0, Windows
# 7.1-9.8 and one at 14.2). pytest-split's shards are even, each within 7% of the
# others by the last run's times; what spreads them is the runners, 0.6 to 1.4
# times as fast as each other within one run (Windows' 14.2 ran 1.41 times slower
# than its tests' last run).
#
# Every job has a timeout of about twice its usual time, so a hung shard fails in
# minutes, not at GitHub's six hours. Installs are uv's, not pip's, compiled as
# pip compiles them: about 4 s against 13 on Linux and 20-28 against 50 on Windows
# (run 40232807941 against 40218362245). ci/constraints.txt still pins ruff and mypy.
#
# LEAN CI FOR A TRAIN'S SUB-PRS (owner decision 2026-10-23). A pull request into
# rc/** — one workstream of a release train — runs lint, the py3.12 leg (captain
# on, no ambient) in its 4 shards, the shard check, the Linux package job and
# ci-ok; demo.yml does not render for it at all. Shared runners give about 21
# concurrent jobs, and ten-job runs of 45-minute legs per sub-PR queued for hours.
# Everything else keeps the FULL matrix: a push to rc/** or main (every sub-PR's
# merge, so the full matrix runs on the train branch as each lands), a PR into main
# (the train itself), the nightly, and a run by hand.
#
# The test is spelled the same in every job, as `LEAN` in
# tests/test_ci_is_lean_for_sub_prs.py, which pins the split:
#   github.event_name == 'pull_request' && startsWith(github.base_ref, 'rc/')
# A matrix is chosen with fromJSON(<lean> && '<lean legs>' || '<full legs>'), so a
# leg a sub-PR skips never starts a runner, rather than starting and skipping.
# Contexts in `strategy` are github, needs, vars and inputs only: no `env` to
# name the test once.

jobs:
  lint:
    # Once, not per leg: none of these depends on the platform or the interpreter
    # the suite runs on. Python 3.11 because mypy checks python_version 3.11
    # (pyproject.toml): the third-party packages it reads resolve as for that user.
    name: lint (ruff, format, mypy, uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Pinned to a commit, not a major: astral-sh/setup-uv publishes no floating
      # major tags past v7, so `@v10` does not resolve and the job dies at "Set up
      # job" (review of #307). uv itself is pinned, so a uv release cannot turn the
      # lock check red on its own; a relock with a newer uv still checks.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            ci/constraints.txt

      # ruff and mypy at the versions ci/constraints.txt pins, the ones
      # `make install` puts in a local venv.
      - name: Install
        run: uv pip install --system -c ci/constraints.txt -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy

      # And as the Windows leg ran it, when every leg ran mypy: mypy reads a
      # `sys.platform` check as the platform it runs on, so the Windows branches were
      # type-checked only there.
      - name: Type check as Windows (mypy --platform win32)
        run: mypy --platform win32

      # The suite installs with ci/constraints.txt, so nothing else here reads
      # uv.lock, and it drifted from pyproject.toml unnoticed: `uv run --frozen` then
      # raised `ModuleNotFoundError: yaml` on every persona path (#278). It was a job
      # of its own; it is OS- and Python-independent, so it is a step of this one.
      - name: Check the lock
        run: uv lock --check

  test:
    name: test (${{ matrix.leg }}, shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.os }}
    # About twice a shard's time on a slow runner: 6-8 minutes on Linux, 7-10 on
    # Windows, whose runners vary more (one took 14.2, run 40230136547). A test past
    # pyproject's faulthandler_timeout prints every thread's stack first, and
    # --durations names each shard's slowest tests.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 15 }}
    strategy:
      fail-fast: false
      # Each leg's suite as `shards` jobs: `leg` x `shard`, each leg's settings added
      # by `include`, and Windows' shards past 4 as entries of their own (an `include`
      # entry extends a leg x shard combination only, never one another entry added).
      #
      # Full: ubuntu on 3.11-3.13, plus two legs. The suite runs with the experimental
      # captain ON (tests/conftest.py's autouse captain_on), so every leg tests the
      # captain as it is when turned on. A user who never turns it on gets it OFF, so
      # one more leg runs the whole suite that way (AISQUARE_SUITE_CAPTAIN=off): every
      # test must pass, bar those marked needs_captain, which it skips and says why
      # (review of #240). Windows on one interpreter rather than the full
      # cross-product: the platform-specific branches read sys.platform at call time,
      # so a second Python version re-runs the same branches for ~3x the minutes.
      # `ambient` is `none`, or the ambient environment a leg runs in (the steps
      # below say what that is): proxy-down on py3.11, proxy-up on py3.13.
      # Lean (a sub-PR into rc/**): ubuntu, py3.12, captain on, no ambient.
      matrix: >-
        ${{ fromJSON((github.event_name == 'pull_request' && startsWith(github.base_ref, 'rc/'))
        && '{"leg": ["py3.12"], "shard": [1, 2, 3, 4],
        "include": [{"leg": "py3.12", "os": "ubuntu-latest", "python": "3.12", "captain": "on", "ambient": "none", "shards": 4}]}'
        || '{"leg": ["py3.11-ambient-proxy-down", "py3.12", "py3.13-ambient-proxy-up", "py3.12-captain-off", "windows-py3.12"],
        "shard": [1, 2, 3, 4],
        "include": [{"leg": "py3.11-ambient-proxy-down", "os": "ubuntu-latest", "python": "3.11", "captain": "on", "ambient": "proxy-down", "shards": 4},
        {"leg": "py3.12", "os": "ubuntu-latest", "python": "3.12", "captain": "on", "ambient": "none", "shards": 4},
        {"leg": "py3.13-ambient-proxy-up", "os": "ubuntu-latest", "python": "3.13", "captain": "on", "ambient": "proxy-up", "shards": 4},
        {"leg": "py3.12-captain-off", "os": "ubuntu-latest", "python": "3.12", "captain": "off", "ambient": "none", "shards": 4},
        {"leg": "windows-py3.12", "os": "windows-latest", "python": "3.12", "captain": "on", "ambient": "none", "shards": 10},
        {"leg": "windows-py3.12", "shard": 5, "os": "windows-latest", "python": "3.12", "captain": "on", "ambient": "none", "shards": 10},
        {"leg": "windows-py3.12", "shard": 6, "os": "windows-latest", "python": "3.12", "captain": "on", "ambient": "none", "shards": 10},
        {"leg": "windows-py3.12", "shard": 7, "os": "windows-latest", "python": "3.12", "captain": "on", "ambient": "none", "shards": 10},
        {"leg": "windows-py3.12", "shard": 8, "os": "windows-latest", "python": "3.12", "captain": "on", "ambient": "none", "shards": 10},
        {"leg": "windows-py3.12", "shard": 9, "os": "windows-latest", "python": "3.12", "captain": "on", "ambient": "none", "shards": 10},
        {"leg": "windows-py3.12", "shard": 10, "os": "windows-latest", "python": "3.12", "captain": "on", "ambient": "none", "shards": 10}]}') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # Pinned as in `lint`, and why is said there.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            ci/constraints.txt

      # The same install as `lint`'s: ruff and mypy are not run here, but `.[dev]`
      # with ci/constraints.txt is the environment `make install` gives a developer.
      # Compiled as pip compiles it. uv does not by default, and then a fresh runner's
      # first import of each dependency compiles it, inside whichever test spawns it
      # first: a `python -m aisquare serve` that exits in 4 s took over 15 on Windows
      # and failed its timeout (run 40228630575).
      - name: Install
        run: uv pip install --system --compile-bytecode -c ci/constraints.txt -e ".[dev]"

      # Linux only, and the guard is load-bearing now that `test` has a
      # windows-latest leg: `sudo apt-get` is not a thing on that runner, so an
      # unconditional step fails the job before a single test runs. tmux has no
      # Windows build either — the fleet's live tests skip without it, which is
      # the documented behaviour this step exists to avoid ON LINUX, not a gap
      # to paper over here.
      - name: Install tmux (the fleet's live tests skip without it)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tmux

      # This shard of the suite, on every core (`make test` runs it so, #129 d), split
      # by least duration: the slowest tests first, each to the shard with the least
      # so far, so a run of slow tests in one module cannot land in one shard. The
      # note is for the `shards` job. Every leg but the two ambient ones; theirs is
      # below, and runs the same pytest line, which
      # tests/test_ci_covers_the_ambient_environment.py pins.
      - name: Test (pytest)
        if: matrix.ambient == 'none'
        run: pytest -n auto -ra --durations=20 --splits ${{ matrix.shards }} --group ${{ matrix.shard }} --splitting-algorithm least_duration --shard-manifest "${{ runner.temp }}/shards/${{ matrix.leg }}/${{ matrix.shard }}.json"
        env:
          AISQUARE_SUITE_CAPTAIN: ${{ matrix.captain }}

      # THE AMBIENT ENVIRONMENT: WHY TWO LEGS RUN IN ONE.
      #
      # A leg installs `.[dev]` into a pristine runner: no ~/.aisquare, nothing
      # listening on any port, no optional extra. A developer who has followed
      # docs/connecting-your-agents-to-explainability.md has all three. Three
      # separate bugs in this repo were green there and red for them, and the third
      # was introduced while fixing the second — so the class is worth legs of their
      # own rather than vigilance:
      #
      #   * a module-scoped fixture read the developer's REAL ~/.aisquare, while
      #     its docstring claimed "a machine with nothing configured";
      #   * a "proxy is down" premise was asserted against the CONFIGURED proxy
      #     URL, which is 9090 — the port its own docstring says to avoid because
      #     something is usually on it;
      #   * a fixture patched the PATH lookup for a console script and not the
      #     lookup beside the interpreter, so the real script won over the stub.
      #
      # TWO OF THE THREE CONDITIONS ARE REPRODUCED HERE, not three. These legs
      # install `.[dev]`, so "no optional extra" is NOT one of them: the extra
      # shadows an editable checkout (tests/test_contributing_editable_extra.py) and
      # conftest.pytest_sessionstart refuses to grade a non-editable one, so the
      # suite cannot run with the extra installed. The `package` job covers that
      # axis at IMPORT level instead — both distributions importable, the six
      # subcommands present — which is where the bug it caused actually lived. The
      # visible consequence of the gap: test_live_checks_say_what_they_skipped skips
      # in every leg, so test_the_local_sdk_rows_survive_a_gateway_failure asserts
      # nothing on CI. Said out loud because a reader who counts three conditions
      # above will otherwise assume three are covered.
      #
      # TWO VARIANTS, BECAUSE THE LEAKS NEED OPPOSITE PROXY STATES. Measured, not
      # assumed: with a configured home and the proxy DOWN the first bug fires and
      # the second does not; with it UP the second fires and the first does not. A
      # single ambient configuration would have caught one of the two and looked
      # like it covered the class.
      #
      # A properly isolated suite is green in both. Anything that reads ambient
      # machine state fails in one of them. They were jobs of their own, running
      # the suite serially for over an hour; they are the py3.11 and py3.13 legs now,
      # sharded and on every core like the rest (owner decision 2026-10-25), and
      # EVERY SHARD sets up the ambient and asserts its premise before and after its
      # part of the suite: a shard is a runner of its own, with nothing of another's.
      # Not on a sub-PR into rc/** (lean CI, above): its merge runs both on rc/**.
      # ONE definition of the ambient environment, and $GITHUB_ENV rather than a
      # job-level `env:` block for a measured reason: `runner.temp` is NOT
      # available in a job-level env — only `github`, `needs`, `strategy`,
      # `matrix`, `vars`, `inputs` and `secrets` are — and GitHub rejects the
      # WHOLE FILE for it. That failure is near-silent from the outside: the run
      # has zero jobs, no log, and `gh pr checks` reports nothing at all, so it
      # reads as "CI has not started yet" rather than as an error.
      #
      # A per-step `env:` was the other option and is worse: duplicated across
      # the configure and test steps, the test step could lose it — to a delete
      # or a typo — and this job would degrade to "`check`, twice, one of them
      # with a listener", green, with every guard still passing. That is the
      # home-axis twin of the proxy bug this job exists for.
      - name: Declare the ambient environment
        if: matrix.ambient != 'none'
        run: |
          {
            echo "AMBIENT=${{ matrix.ambient }}"
            echo "AISQUARE_HOME=$RUNNER_TEMP/aisquare-home"
            # The variables tests/conftest.py goes out of its way to CLEAR, whose
            # own comment says "an operator's shell has these sourced from their
            # explainability env file". Exactly the same escape hatch as the
            # home: a module- or session-scoped fixture reads them straight out
            # of os.environ. Set consistent with the configured home, because the
            # axis being reproduced is "these are present at all", not a second,
            # contradictory configuration for a reader to untangle.
            echo "AISQUARE_EXPLAINABILITY_TARGET=prod"
            echo "EXPLAINABILITY_GATEWAY_URL=https://gateway.invalid"
            # NOT EXPLAINABILITY_API_KEY, and deliberately: key resolution is
            # env-first, so setting it would make the key FILE unreachable — and
            # the file is both the case the setup guide documents and the state
            # (`key_set`, `key_source: file`) the leaked fixture was sampling.
            # The env-var branch of that resolver is covered by unit tests; the
            # file branch is what needs a populated home to be real.
            # Set for anyone running the suite from inside a Claude session.
            echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config"
            # The rest of what a launch onto a Claude account exports: the
            # scratch directory that goes with the config dir
            # (core.claude_accounts.LAUNCH_VARS), and the copies of the shell's
            # own two a launch onto a managed slot keeps (PLAIN_VARS) — what a
            # developer running the suite from a fleet pane on one of their
            # slots has. The account tests point CLAUDE_CONFIG_DIR at a managed
            # slot themselves, and with the copies left set they resolved slot 1
            # to the developer's directory (review of #205, seventh round).
            # Consistent with the line above: the shell's own are those.
            echo "CLAUDE_CODE_TMPDIR=$RUNNER_TEMP/claude-tmp"
            echo "AISQUARE_PLAIN_CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config"
            echo "AISQUARE_PLAIN_CLAUDE_CODE_TMPDIR=$RUNNER_TEMP/claude-tmp"
          } >> "$GITHUB_ENV"

      - name: Configure an aisquare home, the way a developer's machine is
        if: matrix.ambient != 'none'
        run: |
          # Deliberately NOT the default location: the point is a POPULATED home
          # that the suite must ignore, and a runner's real ~ stays empty so a
          # leak is unambiguous rather than accidental.
          mkdir -p "$AISQUARE_HOME" "$CLAUDE_CONFIG_DIR" "$CLAUDE_CODE_TMPDIR"
          cd "$(mktemp -d)"        # so `init` does not pack the checkout
          aisquare init --yes
          # No --proxy-url: the DEFAULT is 9090, and the default is what the
          # proxy-up variant collides with. Hardcoding it here would let the
          # default drift out from under this job.
          aisquare explainability enable --target prod --gateway-url https://gateway.invalid
          # A key so `status` resolves one and reports `key_set` — the state the
          # leaked fixture was sampling. Not credential-shaped: this repo's push
          # protection has rejected realistic-looking literals before.
          printf '%s' 'not-a-real-ci-key' > "$AISQUARE_HOME/explainability-key"
          chmod 600 "$AISQUARE_HOME/explainability-key"

          # THE HOME AXIS'S OWN PREMISE, asserted — the proxy axis is not the only
          # one that can silently fail to hold. `set -e` catches an `enable` that
          # FAILS; nothing catches one that succeeds while leaving a home the suite
          # would read as unconfigured. Observed while building this job: a home
          # that had not taken reported `enabled: false`, and `status` exits 0
          # whatever the proxy is doing when tracing is off — so proxy-up went
          # vacuously GREEN and proxy-down failed for the wrong reason. Both
          # variants are meaningless without this, so it is checked once here
          # rather than trusted.
          #
          # `|| true` for the same reason as in the next step: the proxy is down at
          # this point by definition, which is exactly when `status` exits non-zero.
          # One line on purpose: a `python -c` script written across lines has to
          # start at column 0, which ENDS this block scalar and makes the whole
          # workflow file invalid.
          settings=$(aisquare explainability status --json || true)
          printf '%s' "$settings" \
            | python -c 'import json, sys; s = json.load(sys.stdin); bad = [(k, s.get(k), w) for k, w in (("enabled", True), ("key_source", "file")) if s.get(k) != w]; sys.exit(f"::error::ambient home is not what this job requires, got/wanted: {bad}" if bad else 0)'

      # ONE STEP, and the reason was measured rather than reasoned about. A `&`
      # background process started in its own step is killed when that step's
      # process group ends, so a separate "occupy the port" step left the port
      # FREE during pytest and proxy-up silently became a second proxy-down.
      # Proven in CI before it was fixed: both variants failed IDENTICALLY on the
      # same commit. Starting the listener and running the suite in one shell is
      # what keeps them in the same process group.
      - name: Test (pytest, in the ambient environment)
        if: matrix.ambient != 'none'
        run: |
          # THE VARIANT NAME, checked before anything dispatches on it. Every
          # dispatch below is `if [ "$AMBIENT" = "proxy-up" ] … else <proxy-down>`,
          # so ANY other value — the empty string included — takes the proxy-down
          # branch and the job reports BOTH matrix names having run the SAME
          # ambient. That is the failure the stub's own gate is guarded against,
          # reached through a different door.
          #
          # Two ordinary edits produce the empty string: deleting the `AMBIENT=`
          # line from the Declare step, or renaming the legs' `ambient` field without
          # updating it. Neither is caught by anything else — an unknown `matrix` property
          # expands to "" with NO error, and `check-jsonschema` does not type
          # matrix properties. Measured: with `$AMBIENT` empty the step runs
          # proxy-down, logs `ambient premise holds: , port 9090` on both sides,
          # and exits 0. A closed set is the only thing that catches both edits;
          # a leg with no `ambient` at all lands here too, as `''`, because this
          # step runs for anything that is not `none`.
          case "$AMBIENT" in
            proxy-up|proxy-down) ;;
            *)
              echo "::error::unknown ambient variant '$AMBIENT' — everything below treats anything that is not proxy-up as proxy-down, so this run would test ONE ambient under BOTH matrix names"
              exit 1
              ;;
          esac

          # THE CONFIGURED PROXY, read back out of the config — never a literal.
          # The configure step above explains that hardcoding the port would let
          # the default drift out from under this job, and a literal here would do
          # precisely that: the stub would bind a port the CLI no longer probes,
          # every premise check would still pass, and proxy-up would be a silent
          # second proxy-down. That is leak #2 from this job's own list, so
          # spelling `9090` anywhere below would re-create it inside the job
          # written to prevent it.
          #
          # `|| true` is load-bearing, and NOT a swallowed error. `status` exits
          # non-zero when the proxy lane is red — the configured proxy would not
          # take a session, which is every proxy-down run and the first moment of
          # every proxy-up run, since the port has to be read BEFORE the stub can
          # bind it (the other red state, a live proxy that reports shipping to
          # another deployment, cannot arise here: the stub reports none). Under
          # `set -eo pipefail` the read therefore killed the step before pytest in
          # both variants. Measured by running this script, not by reading it. The
          # exit code is tolerated HERE and asserted on LATER; the read failing for
          # a real reason still fails the step, on the numeric check below.
          settings=$(aisquare explainability status --json || true)
          port=$(printf '%s' "$settings" | python -c \
            'import json,sys; from urllib.parse import urlparse; print(urlparse(json.load(sys.stdin)["proxy"]).port or 80)')
          case "$port" in
            ''|*[!0-9]*)
              echo "::error::could not read the configured proxy port out of \`explainability status --json\`"
              exit 1
              ;;
          esac
          echo "configured proxy port: $port"

          # `aisquare explainability status` IS the premise assertion, on both
          # variants and on both sides of the suite. It beats a `curl` twice over:
          # it probes whatever the config says (so it cannot drift from what the
          # suite reads), and it checks the `service`/`mode` contract rather than
          # "something answered 200 on a port". Its exit-code rule — non-zero only
          # when tracing is on and the proxy lane is red: the proxy would not take
          # a session, or it is alive and reports shipping to another deployment;
          # amber exits 0 — is pinned by tests/test_proxy_state_wording.py, so
          # this is not leaning on an incidental behaviour.
          assert_proxy() {
            if [ "$AMBIENT" = "proxy-up" ]; then
              aisquare explainability status >/dev/null \
                || { echo "::error::proxy-up: the configured proxy on port $port is NOT answering ($1 the suite) — this variant is a silent duplicate of proxy-down"; exit 1; }
            else
              # Asserted on proxy-down too. Nothing holds this port on
              # ubuntu-latest today, so it is the asymmetry that is the bug: a PR
              # whose thesis is "assert the premise rather than assuming it" must
              # not leave one variant assuming. It becomes real the day this runs
              # on a self-hosted or container runner with a leftover listener.
              if aisquare explainability status >/dev/null 2>&1; then
                echo "::error::proxy-down: something IS answering on port $port ($1 the suite) — this variant is a silent duplicate of proxy-up"
                exit 1
              fi
            fi
            # Says so out loud, on success, twice per run. The premise checks are
            # otherwise silent, and "did this variant test the ambient its name
            # claims?" is precisely the question this job exists to make
            # answerable — from the log, without re-deriving it.
            echo "ambient premise holds: $AMBIENT, port $port, $1 the suite (shard ${{ matrix.shard }}/${{ matrix.shards }})"
          }

          if [ "$AMBIENT" = "proxy-up" ]; then
            # tests/proxy_stub.py, not an inline server: `probe_proxy` checks the
            # `service` and `mode` fields, so a stub is a CONTRACT, and a copy in
            # this file would be the copy nobody runs locally — the one that
            # drifts.
            python -m tests.proxy_stub "$port" &
            stub=$!
            trap 'kill "$stub" 2>/dev/null || true' EXIT
            for _ in $(seq 1 40); do
              aisquare explainability status >/dev/null 2>&1 && break
              sleep 0.25
            done
          fi

          assert_proxy before
          pytest -n auto -ra --durations=20 --splits ${{ matrix.shards }} --group ${{ matrix.shard }} --splitting-algorithm least_duration --shard-manifest "${{ runner.temp }}/shards/${{ matrix.leg }}/${{ matrix.shard }}.json"
          # Re-asserted on the far side, because a listener that died mid-suite
          # would otherwise leave a GREEN run that silently tested the other
          # ambient — and a job cannot notice that it tested the wrong thing.
          assert_proxy after
        env:
          AISQUARE_SUITE_CAPTAIN: ${{ matrix.captain }}

      # Whatever the suite did, so a red shard's split is checked too. Its own
      # artifact per shard: the `shards` job merges them, one folder per leg.
      - name: Keep this shard's note for the shards job
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.leg }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shards/
          if-no-files-found: error
          retention-days: 7

  shards:
    # A split that drops a test is green: nothing fails for a test that never ran.
    # So every shard notes what it collected and what it ran (tests/shards.py), and
    # this fails unless, for each leg, every shard reported, all of them collected
    # the same suite, and between them they ran each collected test exactly once.
    # After the shards whatever they did (`!cancelled()`), so a red shard's split is
    # still checked. The runner's own python3: the check is stdlib only.
    name: shards (complete and disjoint)
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Fetch every shard's note
        uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Check that each leg's shards ran its suite exactly once
        run: python3 -m tests.shards check "$RUNNER_TEMP/shards"

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Lean (a sub-PR into rc/**): Linux only; Windows on its merge.
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'pull_request' && startsWith(github.base_ref, 'rc/'))
          && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # PyPI builds the project page from this metadata, and a release's page
      # cannot be edited after the upload. `--strict` fails on a missing long
      # description or content type. Ubuntu only: publish.yml builds and uploads
      # the dists there, and this metadata does not depend on the OS. It does not
      # render Markdown (twine treats that as "cannot fail"); the README's links
      # are tests/test_readme_is_a_front_page.py's job.
      - name: Check the dists' PyPI metadata (twine)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*

      # One Python driver instead of two shell dialects: the venv layout differs
      # (bin/ vs Scripts/) and `dist/*.whl` is a shell glob that cmd.exe does not
      # expand, so the portable way to smoke-test the artifact is to resolve both
      # in Python and hand subprocess an argv.
      - name: Install the wheel and smoke-test the console scripts
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected exactly one wheel, got {wheels}"

          venv = Path(os.environ["RUNNER_TEMP"]) / "smoke"
          subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
          bindir = venv / ("Scripts" if sys.platform == "win32" else "bin")
          suffix = ".exe" if sys.platform == "win32" else ""

          subprocess.run([str(bindir / f"pip{suffix}"), "install", str(wheels[0])], check=True)
          for argv in (
              [f"aisquare{suffix}", "--version"],
              [f"asq{suffix}", "--version"],
              [f"aisquare{suffix}", "--help"],
          ):
              subprocess.run([str(bindir / argv[0]), *argv[1:]], check=True)

          # Remote works out of the box (#34): with no extra, the bundled ngrok
          # imports and the server starts and serves its page, in a home of its own.
          remote = (
              "import socket, urllib.request\n"
              "from aisquare.services import ngrok_sdk, remote_server\n"
              "assert ngrok_sdk.sdk() is not None, 'the bundled ngrok'\n"
              "probe = socket.socket(); probe.bind(('127.0.0.1', 0))\n"
              "port = probe.getsockname()[1]; probe.close()\n"
              "info = remote_server.start_remote_server(port=port)\n"
              "try:\n"
              "    opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))\n"
              "    assert opener.open(info.url_local, timeout=30).status == 200\n"
              "finally:\n"
              "    remote_server.stop_remote_server()\n"
          )
          home = Path(os.environ["RUNNER_TEMP"]) / "remote-home"
          python = bindir / f"python{suffix}"
          env = {**os.environ, "AISQUARE_HOME": str(home)}
          subprocess.run([str(python), "-c", remote], check=True, env=env, cwd=os.environ["RUNNER_TEMP"])

      # THE INSTALL LINE THE SETUP GUIDE ACTUALLY GIVES PEOPLE, which nothing
      # tested until now. It is a different environment from every other job
      # here: the SDK shares this package's top-level import name, so the two
      # distributions land in ONE site-packages/aisquare/ directory and the
      # last writer wins the shared __init__.py. That has already broken the
      # CLI once — a build that read `__version__` off the top-level package
      # died at import with the extra installed, and no job would have seen it.
      #
      # A separate venv from the one above so the plain install stays proven
      # too: an extra that starts pulling something harmful must not be able to
      # hide behind an earlier green step.
      #
      # Driven from Python for the same reason the step above is, and run on
      # BOTH legs rather than gated to ubuntu: the collision is a fact about one
      # shared directory on disk, and Windows is where "overwrite a file some
      # other process is holding open" is a different answer.
      - name: Install the wheel WITH the explainability extra
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          # Exactly one wheel, asserted: `<path>[explainability]` collapses two
          # paths into ONE argument if dist/ ever holds a second wheel, and pip
          # would then fail on a nonsense requirement rather than on the real
          # problem.
          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected exactly one wheel, got {wheels}"

          venv = Path(os.environ["RUNNER_TEMP"]) / "extra"
          subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
          bindir = venv / ("Scripts" if sys.platform == "win32" else "bin")
          suffix = ".exe" if sys.platform == "win32" else ""

          # This resolves aisquare[explainability] from PyPI UNPINNED, on purpose:
          # the SDK shares our top-level import name, so an SDK release that
          # breaks the collision should turn CI red here rather than turn a
          # developer's install red after a merge. The cost is a merge-time
          # external dependency.
          requirement = f"{wheels[0]}[explainability]"
          subprocess.run([str(bindir / f"pip{suffix}"), "install", requirement], check=True)

      # Its own step rather than folded into the install above, so the summary
      # says at a glance which half broke: the unpinned resolve, or the
      # collision it exists to prove survivable.
      - name: Smoke-test the extra
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          venv = Path(os.environ["RUNNER_TEMP"]) / "extra"
          bindir = venv / ("Scripts" if sys.platform == "win32" else "bin")
          suffix = ".exe" if sys.platform == "win32" else ""
          aisquare = str(bindir / f"aisquare{suffix}")

          # Survives the shared-__init__ collision, whichever distribution won it.
          subprocess.run([aisquare, "--version"], check=True)
          # The extra's whole job: the SDK importable in the CLI's environment.
          probe = "import aisquare.explainability, aisquare.cli.app"
          subprocess.run([str(bindir / f"python{suffix}"), "-c", probe], check=True)
          # And the surface the guide sends people to. Six subcommands, asserted
          # by name — `--version` cannot distinguish a build with this
          # integration from one without it, which is exactly how a release
          # shipped that could not connect.
          for cmd in ("status", "enable", "disable", "register", "ship", "env"):
              subprocess.run(
                  [aisquare, "explainability", cmd, "--help"],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )

  ci-ok:
    # The one check for branch protection to require: its name does not move with
    # the legs, the shards or a sub-PR's lean set, and it passes only when every job
    # it needs passed. `always()`, so a failed or cancelled job makes it FAIL rather
    # than skip: a skipped job satisfies a required check. Anything but `success`
    # fails it, a skipped job included: nothing here is skipped on purpose.
    name: ci-ok
    needs: [lint, test, shards, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that every job this run needs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::not every job passed: $failed"
            exit 1
          fi
