name: install.sh

# WHY THIS IS ITS OWN WORKFLOW rather than jobs bolted onto ci.yml.
#
# `install.sh` is the only artifact in this repo that runs on other people's
# machines, as root-adjacent, from a pipe, on distributions nobody here uses.
# Its tests are correspondingly unlike the rest: they need containers rather
# than a Python matrix, they take minutes rather than seconds, and they must run
# on a SCHEDULE as well as on pushes — two of the four things the script fetches
# belong to other people (astral's uv installer, NodeSource, Anthropic's Claude
# Code installer, fnm), and when one of those changes its interface the failure
# should land on our clock rather than a new user's (§10).
#
# Keeping it separate also means the static half can gate quickly while the
# container matrix is still running.

on:
  pull_request:
    branches: [main, "rc/**"]
    paths:
      - install.sh
      - install.ps1
      - tests/install/**
      - tests/test_install_script_*.py
      - .github/workflows/install.yml
      # The acceptance criterion is a green `doctor`, so a change to the checks
      # can break this workflow without touching a single line of the script.
      - src/aisquare/services/diagnostics.py
  push:
    branches: [main, "rc/**"]
  schedule:
    # 05:20 UTC daily. The third-party installers above are the reason.
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static (shellcheck, shfmt, dash, ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the shell toolchain
        run: |
          sudo apt-get update -qq
          # dash and busybox are the two /bin/sh implementations this script has
          # to survive; shellcheck and shfmt are its linter and formatter.
          sudo apt-get install -y -qq shellcheck dash busybox
          # shfmt is not in apt on this runner image; the release binary is.
          SHFMT=v3.10.0
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT}/shfmt_${SHFMT}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version | head -2
          shfmt --version

      - name: shellcheck
        # --shell=sh so the POSIX dialect is checked, not bash's.
        run: |
          shellcheck --shell=sh install.sh \
            tests/install/cell.sh tests/install/cell-nonroot.sh tests/install/matrix.sh

      - name: shfmt (format check)
        run: |
          shfmt -i 4 -ci -d install.sh \
            tests/install/cell.sh tests/install/cell-nonroot.sh tests/install/matrix.sh

      - name: Parse under dash and BusyBox ash
        # `sh -n` under BOTH, because bash accepts things neither does and
        # /bin/sh is dash on Debian and Ubuntu and BusyBox ash on Alpine. A
        # bashism that reaches a user's /bin/sh does not degrade — it fails.
        # NO `&&`. GitHub runs `run:` blocks as `bash -e {0}`, and under `set -e`
        # a command that fails as the NON-FINAL element of an `&&` list does not
        # exit the shell — it only makes the list return non-zero. The loop then
        # carried on, and the loop's own status is that of its LAST command. So a
        # construct that dash rejects and BusyBox ash accepts left this job
        # GREEN — and dash is /bin/sh on Debian and Ubuntu, the two largest
        # targets. Exactly the shape of the /dev/tty bug: invisible on the
        # platforms that matter most.
        run: |
          for script in install.sh tests/install/cell.sh \
            tests/install/cell-nonroot.sh tests/install/matrix.sh; do
            dash -n "$script"
            echo "dash  ok: $script"
            busybox ash -n "$script"
            echo "ash   ok: $script"
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: The Python-side guards, under dash as /bin/sh
        # tests/test_install_script_functions.py shells out to `sh`, so on this
        # runner the FUNCTIONS are exercised under dash rather than bash — which
        # is the interpreter most users' machines will use.
        #
        # ASSERTED, NOT ARRANGED. Ubuntu already points /bin/sh at dash, so the
        # first version of this step reconfigured it anyway and got the debconf
        # incantation wrong ("parse error on line 1: 'dash'", a red job for a
        # setting that was already correct). Checking the premise instead means a
        # runner image that ever switches to bash fails HERE, naming the reason,
        # rather than silently downgrading these tests to a second bash run.
        run: |
          python -m pip install --upgrade pip >/dev/null
          pip install -e ".[dev]" >/dev/null
          sh_is=$(readlink -f /bin/sh)
          echo "/bin/sh -> $sh_is"
          case "$sh_is" in
            */dash) ;;
            *)
              echo "::error::/bin/sh on this runner is $sh_is, not dash — these tests would run under bash, which is not what they are here to check. Install dash and repoint /bin/sh, or drop this job's claim."
              exit 1
              ;;
          esac
          pytest -ra tests/test_install_script_is_posix.py tests/test_install_script_functions.py

  powershell:
    name: install.ps1 (parse + analyse)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host "parse: clean"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # PINNED. An unpinned linter can turn an untouched file red when a new
          # rule ships, and this job is the only gate on install.ps1. 1.22.0 also
          # runs on older pwsh, which is what makes it reproducible locally:
          #   podman run --rm -v "$PWD:/mnt:ro" mcr.microsoft.com/powershell \
          #     pwsh -c 'Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 \
          #       -Force -Scope CurrentUser -SkipPublisherCheck; Import-Module PSScriptAnalyzer;
          #       Invoke-ScriptAnalyzer -Path /mnt/install.ps1 -Severity Error,Warning \
          #         -ExcludeRule PSAvoidUsingWriteHost'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Force `
            -Scope CurrentUser -SkipPublisherCheck
          Import-Module PSScriptAnalyzer
          # PSAvoidUsingWriteHost is excluded, and it is the only exclusion.
          # The rule's own reasoning is "it might not work in all hosts, does not
          # work when there is no host, and cannot be captured or redirected" —
          # which is a description of what this script WANTS. It is an
          # interactive bootstrap whose entire output is coloured console text
          # for a person watching; Write-Output would put those lines in the
          # pipeline, where `irm ... | iex` would return them as values.
          #
          # PSUseBOMForUnicodeEncodedFile is NOT excluded, and it found a real
          # bug: the file had em dashes with no BOM, which Windows PowerShell
          # 5.1 reads as ANSI. install.ps1 is pure ASCII now.
          $found = Invoke-ScriptAnalyzer -Path ./install.ps1 `
            -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          if ($found) { $found | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host "analyzer: clean (PSAvoidUsingWriteHost excluded, see comment)"

      # The WSL DELEGATION ITSELF IS NOT TESTED HERE, said out loud rather than
      # left as a gap a reader has to notice: GitHub's windows-latest runners do
      # not have WSL2, so the one path that matters cannot be exercised. What is
      # checked is that the script parses, analyses clean, and takes its
      # "no WSL installed" branch — which is what a runner can honestly prove.
      # The fleet's own key matrix is manual on Windows for the same reason
      # (docs/plans/fleet-tui.md).
      - name: The no-WSL branch
        shell: pwsh
        run: |
          # The runner has wsl.exe but no distribution, so this is the
          # "present but empty" branch. Exit 1 is the CORRECT outcome.
          ./install.ps1
          if ($LASTEXITCODE -ne 1) {
            Write-Host "expected exit 1 with no WSL distribution, got $LASTEXITCODE"
            exit 1
          }
          Write-Host "no-WSL branch: exits 1 with the wsl --install advice"
          # EXPLICIT, and required. `$LASTEXITCODE` is still 1 from the call
          # above when this block ends, and pwsh hands that to the runner — so
          # the step failed while asserting, correctly, that the script exits 1.
          # Measured: the log read "no-WSL branch: exits 1 …" immediately above
          # "##[error]Process completed with exit code 1".
          exit 0

  matrix:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        # Each image earns its place by a property no other has — the reasons
        # are in tests/install/matrix.sh's header, beside the code that uses
        # them, rather than duplicated here.
        image:
          - debian:12
          - ubuntu:22.04
          - fedora:41
          - archlinux
          - alpine:3.22
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build a wheel from THIS tree
        # Not PyPI. The cell's acceptance criterion is a green `doctor`, and
        # doctor's checks are part of what this branch changes — so grading
        # against the last release would grade the wrong code.
        run: |
          python -m pip install --upgrade pip build >/dev/null
          python -m build --wheel --outdir dist .
          ls -l dist

      - name: Run the cell
        run: |
          # A glob into "$@", not `ls`: exactly one wheel is the assertion, and
          # `$(ls dist/*.whl)` collapses two paths into ONE argument if dist/
          # ever holds a second — the same trap ci.yml's package job calls out.
          set -- dist/*.whl
          test "$#" -eq 1 || { echo "expected one wheel, found $#: $*"; exit 1; }
          wheel=$1
          docker run --rm \
            -v "$PWD:/mnt:ro" \
            -e "AISQUARE_INSTALL_PACKAGE=/mnt/$wheel" \
            -e CELL_SKIP_AGENT=1 \
            -e HOME=/root \
            "${{ matrix.image }}" sh /mnt/tests/install/cell.sh

  macos:
    name: macOS (Homebrew path)
    runs-on: macos-latest
    needs: static
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build a wheel from THIS tree
        run: |
          python -m pip install --upgrade pip build >/dev/null
          python -m build --wheel --outdir dist .

      # NOT tests/install/cell.sh, and the reason is worth stating rather than
      # working around: that script prepares a BARE machine and asserts the full
      # acceptance criterion, and a macOS runner is neither bare nor
      # preparable — Homebrew, git and Node are preinstalled, and there is no
      # way to take them away. So this job asserts what a Mac runner can
      # honestly prove: that the script detects Darwin, picks brew, bootstraps
      # uv, installs the CLI into the shape the `install` doctor check wants,
      # and is a no-op on a second run.
      #
      # WHAT THIS STILL DOES NOT COVER: a Mac with NO Homebrew, which is the one
      # macOS branch §5 actually worries about and the reason §11.3 was a
      # question at all. A runner cannot uninstall Homebrew safely, so that path
      # stays covered only by the unit tests in
      # tests/test_install_script_functions.py.
      - name: Dry run
        run: |
          set -- dist/*.whl
          test "$#" -eq 1 || { echo "expected one wheel, found $#: $*"; exit 1; }
          AISQUARE_INSTALL_PACKAGE="$PWD/$1" NO_COLOR=1 \
            sh install.sh --dry-run --yes --no-project --no-agent

      - name: Install for real, into a scratch HOME
        env:
          NO_COLOR: "1"
        run: |
          set -- dist/*.whl
          wheel="$PWD/$1"
          export HOME="$RUNNER_TEMP/scratch-home"
          mkdir -p "$HOME"
          AISQUARE_INSTALL_PACKAGE="$wheel" sh install.sh --yes --no-project --no-agent
          export PATH="$HOME/.local/bin:$PATH"
          aisquare --version
          asq --version

      - name: The machine-wide checks that do not depend on a bare machine
        env:
          NO_COLOR: "1"
        run: |
          export HOME="$RUNNER_TEMP/scratch-home"
          export PATH="$HOME/.local/bin:$PATH"
          amber=$(aisquare --json doctor \
            | tr '{' '\n' \
            | sed -n \
                -e 's/.*"name": *"\([^"]*\)".*"status": *"warn".*/\1/p' \
                -e 's/.*"name": *"\([^"]*\)".*"status": *"fail".*/\1/p' \
            | sort | tr '\n' ' ')
          echo "not ok: [$amber]"
          # `install` amber would mean uv produced a shape doctor rejects — the
          # §3.1 claim this whole bootstrap choice rests on. `tiktoken` amber
          # would mean `--with tiktoken` did not take.
          case "$amber" in
            *install*)  echo "::error::the install check is amber on macOS"; exit 1 ;;
            *tiktoken*) echo "::error::tiktoken is amber — --with tiktoken did not take"; exit 1 ;;
          esac
          # `snapshot` and `brain` are expected here: --no-project registers
          # nothing, and gbrain is out of scope.

      - name: Re-run — a current machine installs nothing
        env:
          NO_COLOR: "1"
        run: |
          set -- dist/*.whl
          export HOME="$RUNNER_TEMP/scratch-home"
          export PATH="$HOME/.local/bin:$PATH"
          # The PyPI-named target and --offline, for the same reason
          # tests/install/cell.sh's run 3 uses them: the short-circuit never
          # fires for a local build, and --offline makes "current" independent
          # of what PyPI happens to serve.
          sh install.sh --yes --offline --no-project --no-agent | tee /tmp/rerun.log
          grep -q 'Nothing to do' /tmp/rerun.log \
            || { echo "::error::the re-run did not short-circuit"; exit 1; }

  non-root:
    name: ubuntu:22.04 as a normal user with sudo
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build a wheel from THIS tree
        run: |
          python -m pip install --upgrade pip build >/dev/null
          python -m build --wheel --outdir dist .

      # THE PRIMARY CASE, and the one every other cell cannot reach. A container
      # gives you root, and root is a legitimate path — §3.7 permits it where
      # there is no other user, which is what a Dockerfile is — but it is the
      # path where `PKG_SUDO` is EMPTY and `sudo_run` degrades to a plain `run`.
      # So the whole matrix was exercising the branch a person never takes.
      #
      # This cell creates a user with NOPASSWD sudo and runs the same
      # assertions as them, which exercises: sudo called for one command at a
      # time, the apt keyring for `gh` written under /etc as root while uv,
      # aisquare and Claude Code land in the user's own ~/.local/bin, and
      # `preflight`'s root refusal correctly NOT firing.
      - name: Run the cell as a non-root user
        run: |
          set -- dist/*.whl
          test "$#" -eq 1 || { echo "expected one wheel, found $#: $*"; exit 1; }
          docker run --rm \
            -v "$PWD:/mnt:ro" \
            -e "AISQUARE_INSTALL_PACKAGE=/mnt/$1" \
            -e CELL_SKIP_AGENT=1 \
            ubuntu:22.04 sh /mnt/tests/install/cell-nonroot.sh

  with-claude-code:
    name: one cell with Claude Code installed for real
    runs-on: ubuntu-latest
    needs: static
    # ALLOWED TO BE FLAKY, on purpose (§8.3). Every cell in `matrix` stubs the
    # agent out so the suite does not depend on a third party's CDN being up;
    # this one installs it for real, because "the fleet has an agent to spawn"
    # is part of what the installer promises and something has to check it.
    # continue-on-error so a CDN blip is a visible amber rather than a red PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build a wheel from THIS tree
        run: |
          python -m pip install --upgrade pip build >/dev/null
          python -m build --wheel --outdir dist .

      - name: Run the cell with the agent installed
        run: |
          set -- dist/*.whl
          test "$#" -eq 1 || { echo "expected one wheel, found $#: $*"; exit 1; }
          wheel=$1
          docker run --rm \
            -v "$PWD:/mnt:ro" \
            -e "AISQUARE_INSTALL_PACKAGE=/mnt/$wheel" \
            -e CELL_SKIP_AGENT=0 \
            -e HOME=/root \
            debian:12 sh /mnt/tests/install/cell.sh
