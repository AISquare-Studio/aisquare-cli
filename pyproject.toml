[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "aisquare-cli"
version = "0.6.0"
description = "Portable memory layer for coding agents — persistent user and project context across sessions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AISquare", email = "anmol@aisquare.studio" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "ai", "agents", "memory", "context"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.26.8",
  "rich>=13.7",
  "pydantic>=2.13.4",
  "tomli-w>=1.2.0",
  # Core since the fleet UI became the default surface (bare `asq` opens it —
  # docs/plans/fleet-tui.md §3.7). Pinned to the major the code targets:
  # cli/watch.py and cli/ui/ lean on 8.2.x internals. Imported lazily, only by
  # the UI entry, so the hook path pays nothing for it.
  "textual>=8.2,<9",
]

[project.optional-dependencies]
serve = [
  # Both bounds are load-bearing, not caution. mcp 2.0.0 renamed FastMCP to
  # MCPServer and REMOVED mcp.server.fastmcp; services/mcp_server.py imports
  # the 2.x names, so a 1.x resolve fails mypy with "Cannot find implementation
  # or library stub for module named mcp.server.mcpserver" -- a red typecheck
  # job on a tree nobody touched, which is exactly how the 1.x pin used to go
  # red the other way. 2.1, not 2.0: that is where the SDK started telling a
  # crashed tool apart from a deliberately failing one (UnexpectedToolError),
  # which the exact-error-wording handler keys on; measured, 2.0.0 and 2.0.1
  # fail its import. <3: the next major is the next rename; cli/serve.py's
  # guard turns an out-of-range install into a sentence, but only the pin
  # keeps one from being resolved in the first place.
  "mcp>=2.1,<3",
]
xr = [
  # The `aisquare xr` transport: static client + one websocket on 8748.
  # Starlette is the ASGI app and uvicorn runs it -- the same pair `serve`
  # already reaches for (mcp brings them in), chosen here for the same reason:
  # the websocket half of this server is twelve lines on starlette and a
  # protocol implementation on anything smaller.
  #
  # The floors are stated as what was MEASURED, not as library history: both
  # are 2024 releases (starlette 0.37.0 2024-02-05, uvicorn 0.30.0
  # 2024-05-28) and both declare requires-python >=3.8, so every interpreter
  # this package supports is in range. The four pins were resolved together
  # with a `pip install --dry-run` on 3.12 and on 3.14 -- the two
  # interpreters on the machine this was written on -- and both pick the same
  # set (starlette 1.6.0, uvicorn 0.52.4, websockets 17.1, faster-whisper
  # 1.2.1). 3.11 and 3.13 were NOT run here; CI's matrix covers them, and
  # that is the honest limit of this note. This code uses nothing newer than
  # the floors: an ASGI app, a websocket route, and
  # `uvicorn.run(app, host=, port=)`.
  #
  # Lower bounds only. An upper bound here would strand an operator who
  # already has a newer starlette in the same environment for something else,
  # and unlike the `mcp` pins above there is no rename to defend against --
  # if one comes, the failure is an import error at start, not a silently
  # wrong server.
  "starlette>=0.37",
  "uvicorn>=0.30",
  # uvicorn speaks HTTP on its own but delegates the websocket protocol, and
  # with neither `websockets` nor `wsproto` installed it answers every
  # handshake with 404 -- a server that serves the page and silently refuses
  # the socket. So this is a runtime dependency of the feature, not a dev
  # convenience. >=12 is the rewritten asyncio implementation uvicorn's
  # `websockets` impl targets.
  "websockets>=12",
  # Speech-to-text for push-to-talk. A later task wires it in behind
  # services/xr/server.py's TRANSCRIBE hook; declared here because the extra
  # is what an operator installs once, and a second install step for the half
  # of the feature that needs a microphone is the step everyone skips.
  "faster-whisper>=1.0",
]
explainability = [
  # This extra installs a distribution that shares our top-level package
  # DIRECTORY. `aisquare` (the SDK) ships aisquare/__init__.py; so do we. pip's
  # RECORD for the two overlaps on exactly that one file and the last writer
  # wins it, silently and without a warning -- a later `pip install -U aisquare`
  # or `pip uninstall aisquare` leaves the SDK's __init__ in place, or none.
  #
  # That is survivable, load-bearingly so: aisquare/cli, /core, /services and
  # aisquare/explainability, /governance are different directories, and an
  # absent __init__.py merely makes `aisquare` a PEP 420 namespace package. The
  # ONE thing that cannot survive it is reading a name out of the top-level
  # __init__, which nothing in this package does any more -- see
  # aisquare/core/version.py and tests/test_sdk_coexistence.py, which goes red
  # if that ever regresses.
  #
  # Installing through THIS extra is also the order that leaves our __init__ in
  # place (pip installs the dependency first), which is why the CLI's own advice
  # says `pip install "aisquare-cli[explainability]"` and never a bare
  # `pip install aisquare[explainability]` into an env that already has us.
  #
  # >=1.1 is where AgentRunTracer accepts run_id, which is how a session's spans
  # join the proxy's Run instead of fragmenting into one Run per drain.
  "aisquare[explainability]>=1.1",
]
tui = [
  # Kept as a no-op alias for one release: `pipx install 'aisquare-cli[tui]'`
  # was the documented way to get the board TUI before textual became core.
  "textual>=8.2,<9",
]
experiment = [
  # Deliberately empty of runtime dependencies today, and declared anyway.
  #
  # The CI test bed's transport is stdlib urllib on purpose: the hot path runs
  # synchronously in front of a developer who has just hit enter, and it has to
  # work in a base install, which rules out a hard third-party import there.
  # So `[experiment]` currently installs nothing and enabling is AISQUARE_CI=1
  # plus a URL — the extra exists so the documented install line is real and so
  # the OpenTelemetry work that closes the token-accounting gap has somewhere
  # to land without changing how anyone installs.
]
dev = [
  "pytest>=9.1.1",
  "mypy>=1.10",
  "ruff>=0.5",
  # Both bounds are load-bearing, not caution. mcp 2.0.0 renamed FastMCP to
  # MCPServer and REMOVED mcp.server.fastmcp; services/mcp_server.py imports
  # the 2.x names, so a 1.x resolve fails mypy with "Cannot find implementation
  # or library stub for module named mcp.server.mcpserver" -- a red typecheck
  # job on a tree nobody touched, which is exactly how the 1.x pin used to go
  # red the other way. 2.1, not 2.0: that is where the SDK started telling a
  # crashed tool apart from a deliberately failing one (UnexpectedToolError),
  # which the exact-error-wording handler keys on; measured, 2.0.0 and 2.0.1
  # fail its import. <3: the next major is the next rename; cli/serve.py's
  # guard turns an out-of-range install into a sentence, but only the pin
  # keeps one from being resolved in the first place.
  "mcp>=2.1,<3",
  # Same bounds as the core dependency: the dev env must resolve the major the
  # UI code actually targets, not merely "some textual".
  "textual>=8.2,<9",
  # The CI test bed validates what it EMITS against the server's vendored JSON
  # Schemas (tests/fixtures/ci_contract/v2/schemas), not against a mirror it
  # wrote itself — a scorer with its own predicate can only ever agree with
  # itself. Dev-only: the runtime models are pydantic, and the hot path must
  # work in a base install. types-jsonschema because jsonschema ships no
  # py.typed and mypy runs strict over tests.
  "jsonschema>=4.18",
  "types-jsonschema>=4.18",
  # The web half of `[xr]`, duplicated here exactly as `mcp` is above and for
  # the same reason: mypy runs strict over src and tests, and an unresolvable
  # `import starlette` in services/xr/ is a red typecheck job in CI, which
  # installs `.[dev]` alone. faster-whisper is deliberately NOT duplicated --
  # nothing imports it yet (the TRANSCRIBE hook defaults to None), and it
  # drags ctranslate2 and a CUDA-shaped wheel set into every CI run to type
  # nothing.
  "starlette>=0.37",
  "uvicorn>=0.30",
  "websockets>=12",
]

[project.scripts]
aisquare = "aisquare.cli.app:main"
asq = "aisquare.cli.app:main"

[project.urls]
Homepage = "https://aisquare.studio"
Repository = "https://github.com/AISquare-Studio/aisquare-cli"
Issues = "https://github.com/AISquare-Studio/aisquare-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aisquare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aisquare", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
pretty = true
plugins = ["pydantic.mypy"]

# numpy is never imported by this package. It arrives in the type graph only
# because `_pytest.python_api` type-imports it for `approx`, and it is only
# INSTALLED when the `xr` extra is (faster-whisper -> ctranslate2 -> numpy).
# Its stubs are written in PEP 695 `type X = ...`, which mypy rejects while
# `python_version` says 3.11 -- so `pip install -e ".[dev,xr]"` turned a green
# typecheck into one syntax error inside site-packages, in a file nobody here
# wrote or imports. Skipping the body is the honest scope: we are not
# type-checking numpy, we are declining to parse it. Raising `python_version`
# would be the wrong fix twice over -- it is the floor this package supports,
# and it would silently stop checking our own code against 3.11.
#
# BOTH LINES BELOW ARE LOAD-BEARING, and the second is the one that is easy to
# miss: `follow_imports` does not apply to stub files at all unless
# `follow_imports_for_stubs` is on, so `follow_imports = "skip"` ALONE leaves
# the .pyi parsed and the run still dies -- which is what makes this look
# unfixable from the config, and it was reported that way. Measured here on a
# cold cache with numpy 2.5.3 present via `pip install -e ".[dev,xr]"`: both
# lines give "Success: no issues found in 270 source files"; delete the second
# line and .mypy_cache and the same syntax error returns.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
