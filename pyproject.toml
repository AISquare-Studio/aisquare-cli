[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "aisquare-cli"
version = "0.4.0rc1"
description = "Portable memory layer for coding agents — persistent user and project context across sessions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AISquare", email = "anmol@aisquare.studio" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "ai", "agents", "memory", "context"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.26.8",
  "rich>=13.7",
  "pydantic>=2.13.4",
  "tomli-w>=1.2.0",
]

[project.optional-dependencies]
serve = [
  # <2 is load-bearing, not caution: mcp 2.0.0 REMOVED mcp.server.fastmcp,
  # which services/mcp_server.py imports. An unpinned resolve picks 2.x and
  # mypy fails with "Cannot find implementation or library stub for module
  # named mcp.server.fastmcp" -- a red typecheck job on a tree nobody touched.
  "mcp>=1.10,<2",
]
tui = [
  "textual>=1.0",
]
experiment = [
  # Deliberately empty of runtime dependencies today, and declared anyway.
  #
  # The CI test bed's transport is stdlib urllib on purpose: the hot path runs
  # synchronously in front of a developer who has just hit enter, and it has to
  # work in a base install, which rules out a hard third-party import there.
  # So `[experiment]` currently installs nothing and enabling is AISQUARE_CI=1
  # plus a URL — the extra exists so the documented install line is real and so
  # the OpenTelemetry work that closes the token-accounting gap has somewhere
  # to land without changing how anyone installs.
]
dev = [
  "pytest>=9.1.1",
  "mypy>=1.10",
  "ruff>=0.5",
  # <2 is load-bearing, not caution: mcp 2.0.0 REMOVED mcp.server.fastmcp,
  # which services/mcp_server.py imports. An unpinned resolve picks 2.x and
  # mypy fails with "Cannot find implementation or library stub for module
  # named mcp.server.fastmcp" -- a red typecheck job on a tree nobody touched.
  "mcp>=1.10,<2",
  "textual>=1.0",
]

[project.scripts]
aisquare = "aisquare.cli.app:main"
asq = "aisquare.cli.app:main"

[project.urls]
Homepage = "https://aisquare.studio"
Repository = "https://github.com/AISquare-Studio/aisquare-cli"
Issues = "https://github.com/AISquare-Studio/aisquare-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aisquare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aisquare", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
pretty = true
plugins = ["pydantic.mypy"]
