name: CI

on:
  pull_request:
    branches: [main, "rc/**"]
  push:
    branches: [main, "rc/**"]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # Windows on one interpreter rather than the full cross-product: the
          # platform-specific branches read sys.platform at call time, so a
          # second Python version re-runs the same branches for ~3x the minutes.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff)
        run: ruff format --check src tests

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        run: pytest -ra

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # One Python driver instead of two shell dialects: the venv layout differs
      # (bin/ vs Scripts/) and `dist/*.whl` is a shell glob that cmd.exe does not
      # expand, so the portable way to smoke-test the artifact is to resolve both
      # in Python and hand subprocess an argv.
      - name: Install the wheel and smoke-test the console scripts
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected exactly one wheel, got {wheels}"

          venv = Path("smoke").resolve()
          subprocess.run([sys.executable, "-m", "venv", str(venv)], check=True)
          scripts = "Scripts" if sys.platform == "win32" else "bin"
          bindir = venv / scripts
          suffix = ".exe" if sys.platform == "win32" else ""

          subprocess.run([str(bindir / f"pip{suffix}"), "install", str(wheels[0])], check=True)
          for argv in (
              [f"aisquare{suffix}", "--version"],
              [f"asq{suffix}", "--version"],
              [f"aisquare{suffix}", "--help"],
          ):
              subprocess.run([str(bindir / argv[0]), *argv[1:]], check=True)
