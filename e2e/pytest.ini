[pytest]
# Run as:  e2e/.venv/bin/python -m pytest -c e2e/pytest.ini
# rootdir is e2e/, so the product suite's tests/conftest.py (which imports aisquare,
# refuses non-src runs and patches the product in-process) never loads here.
testpaths = journeys
python_files = test_*.py
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    journey: a user journey driven through the real terminal
    known_bug(id): a QA-report finding tracked on the watchlist (reported, never red)
