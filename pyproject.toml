[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "aisquare-cli"
version = "0.9.0"
description = "One terminal over your projects and your coding agents: task a manager in plain words, and it runs the coders, testers and reviewers for you."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AISquare", email = "anmol@aisquare.studio" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "cli",
  "tui",
  "terminal",
  "coding-agents",
  "ai-agents",
  "claude-code",
  "multi-agent",
  "agent-orchestration",
  "agent-memory",
  "tmux",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  # The CLI and memory run natively, and CI tests windows-latest. The fleet UI
  # needs tmux, so on Windows it runs inside WSL2.
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.26.8",
  "rich>=14.3",  # rich.cells.split_graphemes (cli/ui/terminal) exists from 14.3.0
  "pydantic>=2.13.4",
  "tomli-w>=1.2.0",
  # Core since the fleet UI became the default surface (bare `asq` opens it —
  # docs/plans/fleet-tui.md §3.7). Pinned to the major the code targets:
  # cli/watch.py and cli/ui/ lean on 8.2.x internals. Imported lazily, only by
  # the UI entry, so the hook path pays nothing for it.
  "textual>=8.2,<9",
  # A persona IS a Claude Code skill directory (docs/plans/spawn-personas.md
  # §3.3), and a skill's frontmatter is full YAML — block scalars, `metadata`
  # maps, lists. A flat-subset parser would refuse valid skills, which is the
  # one thing an interchange format may not do. safe_load only, on a frontmatter
  # capped at 16 KB, imported inside core/personas.py's parser so the hook path
  # and `aisquare status` pay nothing for it.
  "pyyaml>=6.0",
  # Windows ships no IANA time zone database, and `zoneinfo` falls back to this
  # package for one. Without it `ZoneInfo("America/Toronto")` raises there, so a
  # limit message's named zone was dropped for the offset in force NOW, and a
  # weekly reset across a DST change came out an hour off: the bug round 4 of
  # #205 fixed, back on one platform (core/claude_accounts._resolve_reset).
  # Linux and macOS read /usr/share/zoneinfo and do not install it.
  "tzdata; sys_platform == 'win32'",
  # The Remote modal's QR (cli/ui/views/remote.py). Pure python, typed, one
  # module; imported lazily by the QR renderer only.
  "segno>=1.6",
  # Remote control works out of the box (#34; it was the `remote` extra, which
  # install.sh never installed, so a fresh machine answered Remote with "not
  # installed"). `asq remote serve` and the fleet UI's Remote
  # (services/remote_server.py): one local HTTP+WebSocket port that ngrok
  # exposes to a phone. websockets is uvicorn's WebSocket backend: without it
  # /ws answers "No supported WebSocket library detected". All three are
  # imported inside the server's start only, never on the hook path.
  "starlette>=0.40",
  "uvicorn>=0.30",
  "websockets>=12",
  # Web Push (services/remote_push.py): the RFC 8291 encryption and the RFC 8292
  # VAPID signature are P-256 ECDH, AES-GCM and ES256, none of which the stdlib
  # has. A floor, not a pin: every call used is far older.
  "cryptography>=42",
  # The ngrok agent, bundled (services/ngrok_sdk.py): the official SDK embeds
  # it, with no traffic inspector and no local agent API, as a cp310-abi3
  # wheel for macOS, Linux (x86_64, aarch64) and Windows. 1.5 and later declare
  # Python >=3.12, so a 3.11 install resolves 1.4, which has every call used
  # (SessionBuilder, http_endpoint().domain(), listen_and_forward). Imported
  # when a tunnel starts or a token is checked, never on the hook path.
  # Only where ngrok ships a wheel, since it publishes no sdist (Windows on Arm
  # from 1.5, so from Python 3.12): elsewhere Remote starts an ngrok on PATH, as
  # it always did (ngrok_sdk.bundled_ngrok).
  "ngrok>=1.4; sys_platform == 'darwin' or (sys_platform == 'win32' and (platform_machine != 'ARM64' or python_version >= '3.12')) or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'armv7l'))",
  # Every HTTPS call verifies against the OS trust store (core/tls.py). A
  # python.org Python on macOS ships no CA bundle, so without these every usage
  # read failed CERTIFICATE_VERIFY_FAILED while curl worked. truststore asks the
  # Keychain / Windows store / distro bundle; certifi is the fallback for an
  # interpreter truststore cannot use. Both pure Python, imported lazily.
  "truststore>=0.10",
  "certifi>=2024.7.4",
]

[project.optional-dependencies]
serve = [
  # Both bounds are load-bearing, not caution. mcp 2.0.0 renamed FastMCP to
  # MCPServer and REMOVED mcp.server.fastmcp; services/mcp_server.py imports
  # the 2.x names, so a 1.x resolve fails mypy with "Cannot find implementation
  # or library stub for module named mcp.server.mcpserver" -- a red typecheck
  # job on a tree nobody touched, which is exactly how the 1.x pin used to go
  # red the other way. 2.1, not 2.0: that is where the SDK started telling a
  # crashed tool apart from a deliberately failing one (UnexpectedToolError),
  # which the exact-error-wording handler keys on; measured, 2.0.0 and 2.0.1
  # fail its import. <3: the next major is the next rename; cli/serve.py's
  # guard turns an out-of-range install into a sentence, but only the pin
  # keeps one from being resolved in the first place.
  "mcp>=2.1,<3",
]
llm = [
  # `aisquare persona import`'s api engine (docs/plans/spawn-personas.md §3.9):
  # the official SDK, imported inside the engine function only, so a base
  # install never loads it and a machine without it falls through to the
  # manager engine or to a refusal that names this extra. >=1 is the major
  # whose `messages.parse` structured-output helper the engine calls.
  "anthropic>=1",
]
explainability = [
  # This extra installs a distribution that shares our top-level package
  # DIRECTORY. `aisquare` (the SDK) ships aisquare/__init__.py; so do we. pip's
  # RECORD for the two overlaps on exactly that one file and the last writer
  # wins it, silently and without a warning -- a later `pip install -U aisquare`
  # or `pip uninstall aisquare` leaves the SDK's __init__ in place, or none.
  #
  # That is survivable, load-bearingly so: aisquare/cli, /core, /services and
  # aisquare/explainability, /governance are different directories, and an
  # absent __init__.py merely makes `aisquare` a PEP 420 namespace package. The
  # ONE thing that cannot survive it is reading a name out of the top-level
  # __init__, which nothing in this package does any more -- see
  # aisquare/core/version.py and tests/test_sdk_coexistence.py, which goes red
  # if that ever regresses.
  #
  # Installing through THIS extra is also the order that leaves our __init__ in
  # place (pip installs the dependency first), which is why the CLI's own advice
  # says `pip install "aisquare-cli[explainability]"` and never a bare
  # `pip install aisquare[explainability]` into an env that already has us.
  #
  # >=1.1 is where AgentRunTracer accepts run_id, which is how a session's spans
  # join the proxy's Run instead of fragmenting into one Run per drain.
  "aisquare[explainability]>=1.1",
]
voice = [
  # `aisquare captain voice`: the captain's voice page — one static page and one
  # websocket on 8749, served the way `serve` and cliXR's `xr` serve theirs.
  # starlette + uvicorn are the pair `serve` already reaches for (mcp brings
  # them in); websockets is on the list because uvicorn serves HTTP happily
  # without it and answers every websocket handshake with 404 — the page would
  # load and the mic would never connect. faster-whisper is the transcriber,
  # imported lazily inside the factory (services/captain/voice.py says why);
  # segno draws the QR for the phone and has no dependencies of its own.
  # Floors, not ceilings: the same pins cliXR measured for its [xr] extra.
  "starlette>=0.37",
  "uvicorn>=0.30",
  "websockets>=12",
  "faster-whisper>=1.0",
  "segno>=1.6",
]
remote = [
  # Kept as a no-op alias for one release, as `tui` is: Remote's dependencies
  # are core since #34, and `pipx install 'aisquare-cli[remote]'` was the
  # documented way to get them.
]
code = [
  # `aisquare code`'s TypeScript and JavaScript parsers (core/code_index.py, #285).
  # Python is indexed with the standard library's `ast` and needs nothing here.
  # The per-grammar wheels, not tree-sitter-language-pack: each wheel carries its
  # compiled grammar AND its own queries/tags.scm, so nothing is downloaded at
  # index time (the language pack fetches its grammars on first parse, and the
  # index promises that nothing leaves the machine). Floors: the versions the
  # parser was written and measured against.
  "tree-sitter>=0.25",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.25",
]
tui = [
  # Kept as a no-op alias for one release: `pipx install 'aisquare-cli[tui]'`
  # was the documented way to get the board TUI before textual became core.
  "textual>=8.2,<9",
]
experiment = [
  # Deliberately empty of runtime dependencies today, and declared anyway.
  #
  # The CI test bed's transport is stdlib urllib on purpose: the hot path runs
  # synchronously in front of a developer who has just hit enter, and it has to
  # work in a base install, which rules out a hard third-party import there.
  # So `[experiment]` currently installs nothing and enabling is AISQUARE_CI=1
  # plus a URL — the extra exists so the documented install line is real and so
  # the OpenTelemetry work that closes the token-accounting gap has somewhere
  # to land without changing how anyone installs.
]
dev = [
  "pytest>=9.1.1",
  # The [code] extra's parsers, so tests/test_code_index.py exercises the
  # TypeScript and JavaScript paths in CI rather than skipping them.
  "tree-sitter>=0.25",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-javascript>=0.25",
  # `make test` runs the suite on every core (#129 d). Each test already has a home,
  # a tmux folder and a `claude` stand-in of its own (tests/conftest.py), so workers
  # share nothing a test writes.
  "pytest-xdist>=3.6",
  # CI splits each leg's suite across runners (`--splits N --group k`), by the per-test
  # times in .test_durations; tests/shards.py proves the shards ran it exactly once.
  # A run without --splits is untouched, so `make test` is the whole suite as before.
  "pytest-split>=0.11",
  "mypy>=1.10",
  "ruff>=0.5",
  # Both bounds are load-bearing, not caution. mcp 2.0.0 renamed FastMCP to
  # MCPServer and REMOVED mcp.server.fastmcp; services/mcp_server.py imports
  # the 2.x names, so a 1.x resolve fails mypy with "Cannot find implementation
  # or library stub for module named mcp.server.mcpserver" -- a red typecheck
  # job on a tree nobody touched, which is exactly how the 1.x pin used to go
  # red the other way. 2.1, not 2.0: that is where the SDK started telling a
  # crashed tool apart from a deliberately failing one (UnexpectedToolError),
  # which the exact-error-wording handler keys on; measured, 2.0.0 and 2.0.1
  # fail its import. <3: the next major is the next rename; cli/serve.py's
  # guard turns an out-of-range install into a sentence, but only the pin
  # keeps one from being resolved in the first place.
  "mcp>=2.1,<3",
  # Same bounds as the core dependency: the dev env must resolve the major the
  # UI code actually targets, not merely "some textual".
  "textual>=8.2,<9",
  # The CI test bed validates what it EMITS against the server's vendored JSON
  # Schemas (tests/fixtures/ci_contract/v2/schemas), not against a mirror it
  # wrote itself — a scorer with its own predicate can only ever agree with
  # itself. Dev-only: the runtime models are pydantic, and the hot path must
  # work in a base install. types-jsonschema because jsonschema ships no
  # py.typed and mypy runs strict over tests.
  "jsonschema>=4.18",
  "types-jsonschema>=4.18",
  # PyYAML ships no py.typed; mypy runs strict over src and tests.
  "types-PyYAML>=6.0",
  # The `llm` extra's SDK, so mypy --strict checks the persona import's api engine
  # against the real `messages.parse` signature (the `mcp`/`serve` precedent).
  # Tests never call it: they install a fake `anthropic` module.
  "anthropic>=1",
  # starlette's TestClient, which the remote server tests drive; mcp 2.x no
  # longer brings it. (Remote's own dependencies are core since #34.)
  "httpx>=0.27",
  # tests/test_remote_page.py builds the sdist and the wheel from it, to prove the
  # bundled page ships; without the backend in the env it skipped in every CI job.
  # tests/test_packaging.py builds the wheel too, to assert the bundled personas'
  # SKILL.md files ship in it. Same floor as build-system.
  "hatchling>=1.30.1",
]

[project.scripts]
aisquare = "aisquare.cli.app:main"
asq = "aisquare.cli.app:main"

[project.urls]
Homepage = "https://aisquare.studio"
Repository = "https://github.com/AISquare-Studio/aisquare-cli"
Issues = "https://github.com/AISquare-Studio/aisquare-cli/issues"
Changelog = "https://github.com/AISquare-Studio/aisquare-cli/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/aisquare"]

[tool.hatch.build.targets.sdist]
# The demo's renders (docs/demo.tape) are pictures for the README and the
# release notes, re-rendered rather than built from; no build reads them. Nor does
# any build read .test_durations: it is how CI splits the suite into shards.
exclude = ["/docs/demo.gif", "/docs/demo/*.png", "/.test_durations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# A test still running after 5 minutes dumps every thread's stack to stderr (it is not
# failed: CI's job timeout does that), so a hang names itself in the log.
faulthandler_timeout = 300

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aisquare", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The captain's transcriber imports these lazily, inside the factory, and the plain
# dev extra does not install them (faster-whisper drags in ctranslate2 and av); mypy
# still walks the import lines. Untyped here, checked for real under [voice].
module = ["faster_whisper", "faster_whisper.*", "numpy", "segno"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The code index's TypeScript/JavaScript parsers (#285), imported lazily from the
# optional [code] extra, which the dev extra does not install.
module = ["tree_sitter", "tree_sitter_javascript", "tree_sitter_typescript"]
ignore_missing_imports = true
