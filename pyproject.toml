[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[project]
name = "aisquare-cli"
version = "0.2.0"
description = "Portable memory layer for coding agents — persistent user and project context across sessions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AISquare", email = "anmol@aisquare.studio" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "ai", "agents", "memory", "context"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.26.8",
  "rich>=13.7",
  "pydantic>=2.13.4",
  "tomli-w>=1.2.0",
]

[project.optional-dependencies]
serve = [
  "mcp>=1.10",
]
tui = [
  "textual>=1.0",
]
dev = [
  "pytest>=9.1.1",
  "mypy>=1.10",
  "ruff>=0.5",
  "mcp>=1.10",
  "textual>=1.0",
]

[project.scripts]
aisquare = "aisquare.cli.app:main"
asq = "aisquare.cli.app:main"

[project.urls]
Homepage = "https://aisquare.studio"
Repository = "https://github.com/AISquare-Studio/aisquare-cli"
Issues = "https://github.com/AISquare-Studio/aisquare-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aisquare"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["aisquare", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
pretty = true
plugins = ["pydantic.mypy"]
