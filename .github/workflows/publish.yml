name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) — no API token/secret needed.
# Triggered when a GitHub Release is published. The version that ships is whatever
# is in pyproject.toml, so bump it before tagging the release.
#
# After the publish succeeds, `installers` attaches install.sh and install.ps1 to
# the release, stamped to its version (installers.yml has the URLs and checks).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  installers:
    name: Attach the stamped installers
    needs: publish
    permissions:
      contents: write # gh release upload, in installers.yml
    uses: ./.github/workflows/installers.yml
    with:
      tag: ${{ github.event.release.tag_name }}
      upload: true
